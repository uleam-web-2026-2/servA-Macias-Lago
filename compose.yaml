services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: doublelevel_db
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doublelevel_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${PUERTO}:${PUERTO}"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/doublelevel_db?sslmode=disable
      CLAVE_FIRMA: ${CLAVE_FIRMA}
      PUERTO: ${PUERTO}
      TIEMPO_ESPERA_SEGUNDOS: ${TIEMPO_ESPERA_SEGUNDOS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_pg:
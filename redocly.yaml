# Reglas del curso para validar contratos.
# Parte de las reglas recomendadas de Redocly y apaga tres que todavía no aplican.
extends:
  - recommended
rules:
  security-defined: off       # se enciende en el taller, cuando el contrato declare la sesión
  info-license: off           # un proyecto de clase no publica licencia
  no-server-example.com: off  # en clase el servidor corre en localhost